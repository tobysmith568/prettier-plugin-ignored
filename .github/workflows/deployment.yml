name: Deployment
run-name: Deployment for v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy
        required: true
        type: string

defaults:
  run:
    shell: pwsh

concurrency:
  group: Continuous Deployment
  cancel-in-progress: false

jobs:
  calculate:
    name: Calculate Variables

    runs-on: ubuntu-latest

    outputs:
      npm_tag: ${{ steps.npm_tag.outputs.latest-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set Version
        run: npm version ${{ inputs.version }} --git-tag-version false

      - name: Calculate npm tag
        uses: tobysmith568/npm-publish-latest-tag@v1
        id: npm_tag
        with:
          package-json: ./package.json

  integration:
    name: Run Continuous Integration

    needs:
      - calculate

    uses: ./.github/workflows/integration.yml
    secrets: inherit
    with:
      version: ${{ github.event.inputs.version }}

  deploy:
    name: Deploy

    runs-on: ubuntu-latest

    needs:
      - calculate
      - integration

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org

      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: Build
          path: ./builds

      - name: Deploy
        run: npm publish ./builds/prettier-plugin-ignored-${{ inputs.version }}.tgz --access public --tag ${{ needs.calculate.outputs.npm_tag }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub Release

    needs:
      - deploy

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: Build
          path: ./builds

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          files: builds/**.tgz
          body: |
            # Release v${{ inputs.version }}

            Download from [npm](https://www.npmjs.com/package/prettier-plugin-ignored/v/${{ inputs.version }}):
            ```pwsh
            npm install prettier-plugin-ignored@${{ inputs.version }} --save-dev
            ```
